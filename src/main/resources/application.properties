spring.application.name=car-rental

# Seed fleet_capacity when the table is empty (DB is then the source of truth)
rental.fleet.sedan=5
rental.fleet.suv=3
rental.fleet.van=2
rental.max-rental-days=30

# Java 21+ virtual threads for request handling
spring.threads.virtual.enabled=true

# H2 file database. Bookings survive a restart; tests use an in-memory database instead.
spring.datasource.url=jdbc:h2:file:./data/carrental;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
